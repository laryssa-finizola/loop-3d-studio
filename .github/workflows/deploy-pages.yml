# Build e publicação no GitHub Pages.
#
# O build roda a cada push na main (serve como verificação).
# A publicação só acontece quando a variável do repositório DEPLOY_GITHUB_PAGES = true
# (Settings → Secrets and variables → Actions → Variables). Veja o README.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Padrão: /nome-do-repositorio/. Com domínio próprio, crie a variável BASE_PATH com o valor "/".
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: ${{ vars.DEPLOY_GITHUB_PAGES == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
